# Production image. Gemini keys are read from extractor/.env at start
# and are not baked into the image.
services:
  titlextractor:
    build:
      context: .
      dockerfile: Dockerfile
    image: titlextractor:latest
    ports:
      - "5000:5000"
    env_file:
      - path: extractor/.env
        required: false
    environment:
      PORT: "5000"
      WEB_CONCURRENCY: "${WEB_CONCURRENCY:-2}"
      GUNICORN_TIMEOUT: "180"
      TESSERACT_CMD: /usr/bin/tesseract
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:%s/health'%os.environ.get('PORT','5000'), timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
